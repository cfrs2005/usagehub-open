name: Verify public clients

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: npm ci
      - run: npm run check

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: ./gradlew testStandardDebugUnitTest lintStandardDebug assembleStandardDebug testKioskDebugUnitTest lintKioskDebug assembleKioskDebug --no-daemon --stacktrace
      - name: Build signed standard release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/usagehub-release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/usagehub-release.jks" ./gradlew assembleStandardRelease --no-daemon --stacktrace
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/standard/release/app-standard-release.apk | tee app/build/outputs/apk/standard/release/BADGING.txt
          grep -F "package: name='com.usagehub.app'" app/build/outputs/apk/standard/release/BADGING.txt
          ! "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump xmltree app/build/outputs/apk/standard/release/app-standard-release.apk AndroidManifest.xml | grep -F 'android.intent.category.HOME'
      - run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/standard/debug/app-standard-debug.apk | tee app/build/outputs/apk/standard/debug/BADGING.txt
          grep -F "launchable-activity: name='com.usagehub.app.MainActivity'" app/build/outputs/apk/standard/debug/BADGING.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usagehub-android-debug-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
            android/app/build/outputs/apk/kiosk/debug/app-kiosk-debug.apk
            android/app/build/outputs/apk/standard/release/app-standard-release.apk
            android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
